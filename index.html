"مطاط","مسبح","زلاجة","طاحونة","ساقية","مدفع","بندول","مجهر","ميكروفون","مغناطيس",
// body, materials & ideas
"قلب","عين","يد","أنف","أذن","سن","شعر","لحية","ظفر","عظم","ذهب","فضة","حديد","نحاس","ماس","زمرد","ياقوت","رخام","فحم","نفط",
"كهرباء","كنز","لغز","حلم","صدى","ظلام","نور","دخان","نار","ماء","هواء","تراب","زجاج","خشب","قطن","حرير","صوف","ورد","شوك","جذر"]
.filter((w, i, a) => a.indexOf(w) === i);
const COL = {r:"red", b:"blue", n:"neutral", x:"danger"};
const TEAM = {red:"الفريق الأحمر", blue:"الفريق الأزرق"};
const ind = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// code = "1" + starter (r|b) + 25 colour letters + ("i" + word numbers, 2 base-36 digits each | "t" + words joined by "_")
function parse(h){
  if(h[0] !== "1" || !"rb".includes(h[1])) return null;
  const cols = h.slice(2, 27).split("");
  if(cols.length !== 25 || !cols.every(c => COL[c])) return null;
  const kind = h[27], rest = h.slice(28);
  let words;
  try{
    words = kind === "i" ? (rest.match(/../g) || []).map(x => WORDS[parseInt(x, 36)])
          : kind === "t" ? rest.split("_").map(decodeURIComponent) : [];
  }catch(e){ return null; }
  if(words.length !== 25 || words.some(w => !w)) return null;
  return {starter: h[1], cols, words};
}

function show(){
  const out = document.getElementById("out");
  const m = parse(location.hash.slice(1));
  if(!m){ out.innerHTML = `<p class="err">ما في خريطة هنا.<br>امسح الباركود من شاشة اللعبة.</p>`; return; }
  const st = m.starter === "r" ? "red" : "blue", n = c => m.cols.filter(x => x === c).length;
  out.style.display = "contents";
  // the grid is RTL like the game board, so card 0 sits top-right in both
  out.innerHTML = `<div class="start ${st}">يبدأ ${TEAM[st]}</div>
    <div class="grid">${m.words.map((w, i) => `<div class="c ${m.cols[i]}"><span>${esc(w)}</span></div>`).join("")}</div>
    <div class="counts"><span>أحمر ${ind(n("r"))}</span><span>أزرق ${ind(n("b"))}</span><span>محايد ${ind(n("n"))}</span><span>أسود ${ind(n("x"))}</span></div>
    <p class="note">الترتيب نفس ترتيب البطاقات على شاشة اللعبة. لا تخلي باقي اللاعبين يشوفون جوالك.</p>`;
  fit();
}
// one line per word: shrink until it fits its card
function fit(){
  document.querySelectorAll(".c span").forEach(s => {
    const room = s.parentElement.clientWidth * .86;
    let size = Math.min(30, s.parentElement.clientWidth / 4.2); s.style.fontSize = size + "px";
    while(s.scrollWidth > room && size > 8){ size -= .5; s.style.fontSize = size + "px"; }
  });
}
addEventListener("hashchange", show);
addEventListener("resize", fit);
if(document.fonts) document.fonts.ready.then(fit);
show();
// keep a copy on the phone so the page also opens later without internet
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
